<style>
/* Layout: one compact star-chart matrix — constellations down, characters across, world bands as dividers */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --ink:#1b1f33; --muted:#666c86; --line:#dcdfea;
  --gold:#b98200; --gold-bg:#fff1c7; --ok:#1f8a55; --ok-bg:#d9f2e4; --map:#c4571a; --map-bg:#fde3d2;
  --no:#a8aec2; --unk:#7a6fb0; --unk-bg:#ebe8f7; --band:#e7e9f2; --done-row:#f6faf7;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1020; --panel:#151a30; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --ok:#5fd394; --ok-bg:#143326; --map:#ff9a5c; --map-bg:#3d2414;
  --no:#4a5072; --unk:#b3a8f0; --unk-bg:#252046; --band:#1c2240; --done-row:#121a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1020; --panel:#151a30; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --ok:#5fd394; --ok-bg:#143326; --map:#ff9a5c; --map-bg:#3d2414;
  --no:#4a5072; --unk:#b3a8f0; --unk-bg:#252046; --band:#1c2240; --done-row:#121a28; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border-radius:0;padding:4px 10px;font:600 12px var(--mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.input .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0}
#nick{font:500 14px var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:220px;max-width:100%}
#nick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted);flex:1 1 260px;min-width:0}
.hint a{color:inherit}
.or{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
button:disabled{opacity:.6;cursor:progress}
textarea{width:100%;height:64px;resize:vertical;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
button,.file{font:500 13px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
.ghost,.file{background:transparent;color:var(--ink);border:1px solid var(--line)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
button:focus-visible,.file:focus-within,textarea:focus-visible,label.chk:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:13px;color:var(--muted)} .msg.err{color:var(--map)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
.stat b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px;margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-style:normal;font-size:11px;margin-right:4px;vertical-align:-4px}
label.chk{font-size:13px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:0;border-bottom:1px solid var(--line);text-align:center}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;font-weight:500;font-size:12px;color:var(--muted);vertical-align:bottom;padding:6px 2px}
thead th.ch{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:118px;white-space:nowrap;padding:6px 0;cursor:default}
thead th.ch .cl{opacity:.75;font-size:11px}
th.l,td.l{text-align:left}
thead th.l{padding-left:8px;padding-right:8px}
td.id{font-family:var(--mono);font-weight:600;padding:3px 8px;white-space:nowrap;cursor:help;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
td.rq{padding:3px 8px;min-width:180px;max-width:300px;font-size:12.5px;cursor:help}
td.mp{padding:3px 8px;min-width:120px;max-width:180px;font-size:12px;color:var(--muted);cursor:help}
td.pg{font-family:var(--mono);font-size:12px;padding:3px 8px;white-space:nowrap}
td.st{padding:3px 6px;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;letter-spacing:.02em}
.chip.done{background:var(--ok-bg);color:var(--ok)} .chip.ready{background:var(--gold);color:var(--panel)}
.chip.click{background:var(--gold-bg);color:var(--gold)} .chip.open{background:var(--band);color:var(--muted)}
td.c{width:30px;min-width:28px}
td.c span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-size:12px;font-weight:600;cursor:help}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-click{background:var(--gold-bg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.s-map{background:var(--map-bg);color:var(--map);box-shadow:inset 0 0 0 1px var(--map)} .s-unk{background:var(--unk-bg);color:var(--unk)}
.s-no{color:var(--no)} .s-na{color:var(--no);opacity:.6}
tr.band td{background:var(--band);text-align:left;padding:5px 8px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em}
tr.band td small{font-family:var(--body);font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
tr.isdone td{background:var(--done-row)} tr.isdone td.rq{color:var(--muted)}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.4;pointer-events:none;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
#tip b{font-family:var(--display);font-size:14px}
#tip .t{opacity:.75;font-size:11.5px}
#tip{width:316px;max-width:calc(100vw - 16px)}
#tip svg{display:block;width:100%;height:auto;border-radius:4px;margin:6px 0 4px;background:var(--muted)}
#tip .loc{font-size:12px;margin-bottom:6px}
#tip .loc b{font-family:var(--body);font-size:12.5px}
#tip .media{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
#tip .shot{display:block;width:120px;height:120px;flex:none;border-radius:4px;image-rendering:pixelated;background:var(--muted)}
#tip .mobs{display:flex;flex-direction:column;gap:6px;min-width:0}
#tip .mob{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:11.5px;opacity:.9}
#tip .mob img{max-width:100%;max-height:64px;image-rendering:pixelated}
#tip .src{opacity:.55;font-size:10.5px;margin-top:4px}
.foot{font-size:12.5px;color:var(--muted);max-width:80ch;margin:0}
.foot a{color:inherit}
@media (prefers-reduced-motion:no-preference){td.c span{transition:transform .1s}td.c span:hover{transform:scale(1.15)}}
</style>
</head>

<div class="wrap">

  <div class="stats" id="stats"></div>
  <div class="legend">

    <span><i class="s-click">★</i><span data-i="lg_click"></span></span>

  <div class="tablebox"><table id="tbl"></table></div>

  <p class="foot" data-i="foot"></p>
</div>

    st_done:"complete", st_ready:"click to complete", st_click:"no fighting needed", st_open:n=>`${n} more needed`,
    s_done:"constellations complete", s_pts:"star chart points", s_click:"can be finished without fighting",
    players:n=>`${n} char.`, pts:"pts", letter:"letter", lv:"lv",
    c_ok:"Counted", c_na:"Constellation already complete",
    c_lv_ok:(l,m)=>`Level ${l} ≥ ${m}: walk up and click the star`, c_lv_no:(l,m)=>`Level ${l}, needs ${m}`,
    c_any:"Walk up to the star and click it", c_cls_ok:c=>`${c} fits: walk up and click the star`, c_cls_no:c=>`${c} is the wrong class`,
    c_sk_ok:(s,v,m)=>`${s} ${v} ≥ ${m}: just enter the map`, c_sk_no:(s,v,m)=>`${s} ${v}, needs ${m}`,
    trap:"Trapping", cook:"Cooking",
    c_beg_ok:c=>`${c} fits: defeat Efaunt`, c_beg_no:c=>`${c} is not a Beginner`,
    c_afk:h=>`Claim a single AFK session of ${h}+ h on this map`, c_ev:"Event: counts the moment you do it",
    char:n=>`Character ${n}`, imgsrc:"Images: idleon.wiki, CC BY-NC 3.0", location:"Location",
    e_nokey:"There is no SSprog key in this JSON. Paste the full raw save export.", e_nochar:"No characters found (keys Lv0_0, Lv0_1…).",
    e_fail:"Couldn't read the save: ", ok_n:n=>`Read ${n} characters.`, ok_demo:"Example save with 10 characters.", ok_saved:"Loaded the last save you pasted.",
    foot:'A character is counted only when they click the star (level and "reach this star"), enter the map (Trapping and Cooking), claim AFK on that map, or do the event. The constellation itself also completes on a star click once enough characters are counted. Star names, locations and screenshots: <a href="https://idleon.wiki/wiki/Constellation_Locations" target="_blank" rel="noopener">IdleOn MMO Wiki</a> (CC BY-NC 3.0); requirements come from the game code. A pasted save never leaves the browser; loading by username only downloads the published profile from idleonefficiency.com. <a href="https://github.com/StimDesu/idleon-star-chart" target="_blank" rel="noopener">Source on GitHub</a>.'
  },
  ru: {
    title:"Звёздная карта IdleOn", subtitle:"созвездия по персонажам",
    placeholder:"Вставьте сюда JSON сохранения (Raw data из IdleOn Efficiency или любой экспорт с ключами SSprog, Lv0_0…)",
    parse:"Разобрать", open:"Открыть файл…", demo:"Показать пример",
    nick_ph:"Ник в IdleOn", nick_btn:"Загрузить по нику",
    nick_hint:'Берётся профиль, опубликованный на <a href="https://www.idleonefficiency.com" target="_blank" rel="noopener">idleonefficiency.com</a>. Чтобы обновить данные, опубликуйте профиль там заново.',
    or:"или вставьте raw data", nick_loading:n=>`Загружаю профиль «${n}»…`,
    ok_nick:a=>`Профиль «${a.name}»: ${a.n} персонажей. Данные на момент последней публикации профиля.`,
    e_nick:a=>`Опубликованного профиля «${a.name}» нет (${a.status}). Проверьте ник или вставьте raw data.`,
    e_nickfail:a=>`Не получилось загрузить «${a.name}»: ${a.err}`,
    lg_ok:"засчитан", lg_click:"условие есть, кликнуть звезду", lg_map:"условие есть, зайти на карту",
    lg_unk:"событие, по сохранению не проверить", lg_no:"условие не выполнено", lg_na:"созвездие собрано", hide:"скрыть собранные",
    th_star:"Звезда", th_loc:"Локация", th_req:"Требование", th_have:"Есть", th_status:"Статус",
    st_done:"собрано", st_ready:"кликнуть, чтобы закрыть", st_click:"закрывается без боёв", st_open:n=>`не хватает ${n}`,
    s_done:"созвездий собрано", s_pts:"очков звёздной карты", s_click:"можно закрыть без боёв",
    players:n=>`${n} перс.`, pts:"очк.", letter:"буква", lv:"ур.",
    c_ok:"Засчитан", c_na:"Созвездие уже собрано",
    c_lv_ok:(l,m)=>`Уровень ${l} ≥ ${m}: подойти и кликнуть звезду`, c_lv_no:(l,m)=>`Уровень ${l}, нужен ${m}`,
    c_any:"Подойти к звезде и кликнуть", c_cls_ok:c=>`${c} подходит: подойти и кликнуть звезду`, c_cls_no:c=>`${c} не подходит по классу`,
    c_sk_ok:(s,v,m)=>`${s} ${v} ≥ ${m}: просто зайти на карту`, c_sk_no:(s,v,m)=>`${s} ${v}, нужно ${m}`,
    trap:"Трапперство", cook:"Кулинария",
    c_beg_ok:c=>`${c} подходит: убить Эфаунта`, c_beg_no:c=>`${c} не новичок`,
    c_afk:h=>`Собрать одну AFK-сессию от ${h} ч на этой карте`, c_ev:"Событие: засчитается, когда выполните",
    char:n=>`Персонаж ${n}`, imgsrc:"Картинки: idleon.wiki, CC BY-NC 3.0", location:"Локация",
    e_nokey:"В JSON нет ключа SSprog. Нужен полный сырой экспорт сохранения.", e_nochar:"Не нашёл персонажей (ключи Lv0_0, Lv0_1…).",
    e_fail:"Не получилось разобрать: ", ok_n:n=>`Разобрано: ${n} персонажей.`, ok_demo:"Пример сохранения с 10 персонажами.", ok_saved:"Загружено последнее вставленное сохранение.",
    foot:'Персонаж засчитывается, только когда кликнет по звезде (уровень и «дойти до звезды»), зайдёт на карту (трапперство и кулинария), соберёт AFK на этой карте или выполнит событие. Само созвездие закрывается тоже кликом по звезде, когда набралось нужное число персонажей. Названия, места и скриншоты звёзд: <a href="https://idleon.wiki/wiki/Constellation_Locations" target="_blank" rel="noopener">IdleOn MMO Wiki</a> (CC BY-NC 3.0), требования из кода игры. Вставленное сохранение никуда не отправляется, а загрузка по нику только скачивает опубликованный профиль с idleonefficiency.com. <a href="https://github.com/StimDesu/idleon-star-chart" target="_blank" rel="noopener">Исходники на GitHub</a>.'
  }
};
const CLASS = "0 BEGINNER JOURNEYMAN MAESTRO VOIDWALKER INFINILYTE RAGE_BASICS WARRIOR BARBARIAN SQUIRE BLOOD_BERSERKER NOPE DIVINE_KNIGHT NOPE DEATH_BRINGER FILLER ROYAL_GUARDIAN FILLER CALM_BASICS ARCHER BOWMAN HUNTER SIEGE_BREAKER NOPE NOPE BEAST_MASTER FILLER FILLER FILLER WIND_WALKER SAVVY_BASICS MAGE WIZARD SHAMAN ELEMENTAL_SORCERER SPIRITUAL_MONK BUBONIC_CONJUROR NOPE FILLER FILLER ARCANE_CULTIST".split(" ");
const LETTERS = "_abcdefghijklmnopqrstuvwxyz";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const titleCase = s => s.toLowerCase().split("_").map(w => w[0].toUpperCase()+w.slice(1)).join(" ");
const asArr = v => typeof v === "string" ? JSON.parse(v) : v;
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

let lang = store.get("ss-lang") || ((navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]).some(l => /^ru\b/i.test(l)) ? "ru" : "en");
let L = T[lang];
let current = null, lastMsg = null;

function applyLang(){
  L = T[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  document.querySelectorAll("[data-i]").forEach(el => { const v = L[el.dataset.i]; if (el.dataset.i === "foot" || el.dataset.i === "nick_hint") el.innerHTML = v; else el.textContent = v; });
  $("#save").placeholder = L.placeholder;
  $("#nick").placeholder = L.nick_ph;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  if (lastMsg) showMsg(...lastMsg);
  if (current) render(current);
}

function parseSave(text){
  let o = JSON.parse(text.trim());
  if (o && o.data && !o.SSprog) { const names = o.charNames || o.playerNames; o = Object.assign({}, o.data); if (names && !o.playerNames) o.playerNames = names; }
  if (!o || !o.SSprog) throw new Error("nokey");
  const ss = asArr(o.SSprog);
  const chars = [];
  for (let n = 0; ("Lv0_" + n) in o; n++) {
    chars.push({ name: (o.playerNames && o.playerNames[n]) || null, lv: asArr(o["Lv0_" + n]).map(Number), cls: Number(o["CharacterClass_" + n] ?? 0), letter: LETTERS[n] });
  }
  if (!chars.length) throw new Error("nochar");
  return { ss, chars };
}

function cellState(st, str, done, c){
  if (str.includes(c.letter)) return ["ok", "✓", L.c_ok];
  if (done) return ["na", "·", L.c_na];
  const lvl = c.lv[0] || 0, cn = titleCase(CLASS[c.cls] || "?");
  switch (st.k) {
    case "lv": return lvl >= st.min ? ["click","★",L.c_lv_ok(lvl, st.min)] : ["no","×",L.c_lv_no(lvl, st.min)];
    case "cls":
      if (st.lo === 0 && st.hi >= 99) return ["click","★",L.c_any];
      return (c.cls >= st.lo && c.cls <= st.hi) ? ["click","★",L.c_cls_ok(cn)] : ["no","×",L.c_cls_no(cn)];
    case "skill": { const v = c.lv[st.s] || 0, sk = st.s === 7 ? L.trap : L.cook;
      return v >= st.min ? ["map","⇥",L.c_sk_ok(sk, v, st.min)] : ["no","×",L.c_sk_no(sk, v, st.min)]; }
    case "beg": return c.cls < 5 ? ["unk","?",L.c_beg_ok(cn)] : ["no","×",L.c_beg_no(cn)];
    case "afk": return ["unk","?",L.c_afk(st.h)];
    default: return ["unk","?",L.c_ev];
  }
}

function render(data){
  const { ss, chars } = data, ru = lang === "ru";
  const hide = $("#hideDone").checked;
  const nm = (c, n) => c.name || L.char(n + 1);
  let doneN = 0, pts = 0, ptsAll = 0, clickable = [];
  let h = `<thead><tr><th class="l" style="padding-left:8px">${L.th_star}</th><th class="l">${L.th_loc}</th><th class="l">${L.th_req}</th><th>${L.th_have}</th><th class="l">${L.th_status}</th>`;
  chars.forEach((c, n) => { h += `<th class="ch" data-tip="${esc(nm(c,n))}|${esc(titleCase(CLASS[c.cls]||"?"))} · ${L.lv} ${c.lv[0]||0} · ${L.letter} «${c.letter}»">${n+1}. ${esc(nm(c,n))} <span class="cl">${c.lv[0]||0}</span></th>`; });
  h += `</tr></thead><tbody>`;
  let lastW = "";
  for (const st of STARS) {
    const prog = ss[st.i] || ["", 0];
    const str = String(prog[0] || ""), done = prog[1] == 1;
    ptsAll += st.pts; if (done) { doneN++; pts += st.pts; }
    const cells = chars.map(c => cellState(st, str, done, c));
    const have = [...str].filter(ch => LETTERS.includes(ch)).length;
    const can = cells.filter(x => x[0] === "click" || x[0] === "map").length;
    let chip;
    if (done) chip = `<span class="chip done">${L.st_done}</span>`;
    else if (have >= st.need) chip = `<span class="chip ready">${L.st_ready}</span>`;
    else if (have + can >= st.need) { chip = `<span class="chip click">${L.st_click}</span>`; clickable.push(st.id); }
    else chip = `<span class="chip open">${L.st_open(st.need - have)}</span>`;
    const w = ru ? st.w : st.w_en;
    if (w !== lastW) { lastW = w; h += `<tr class="band"><td colspan="${5 + chars.length}">${w}<small>${esc(st.region)}</small></td></tr>`; }
    if (hide && done) continue;
    const req = ru ? st.req : st.req_en, loc = ru ? st.loc : st.loc_en;
    const tip = `${st.id} · ${st.map}|${loc}|${st.en} · ${st.pts} ${L.pts}|${st.id}`;
    h += `<tr class="${done ? "isdone" : ""}"><td class="id l" data-tip="${esc(tip)}">${st.id}</td>`
      + `<td class="mp l" data-tip="${esc(tip)}">${esc(st.map)}</td>`
      + `<td class="rq l" data-tip="${esc(tip)}">${esc(req)}, ${L.players(st.need)}</td>`
      + `<td class="pg">${have}/${st.need}</td><td class="st l">${chip}</td>`;
    cells.forEach((x, n) => { h += `<td class="c"><span class="s-${x[0]}" data-tip="${esc(nm(chars[n],n))} · ${st.id}|${esc(x[2])}|${esc(loc)}|${st.id}">${x[1]}</span></td>`; });
    h += `</tr>`;
  }
  $("#tbl").innerHTML = h + `</tbody>`;
  $("#stats").innerHTML =
    `<div class="stat"><b>${doneN}/${STARS.length}</b><span>${L.s_done}</span></div>`
  + `<div class="stat"><b>${pts}/${ptsAll}</b><span>${L.s_pts}</span></div>`
  + `<div class="stat"><b>${clickable.length}</b><span>${L.s_click}${clickable.length ? ": " + clickable.join(", ") : ""}</span></div>`;
}

function showMsg(kind, key, arg){
  lastMsg = [kind, key, arg];
  const v = L[key];
  $("#msg").className = kind === "err" || kind === "errf" ? "msg err" : "msg";
  $("#msg").textContent = kind === "err" ? L.e_fail + (L[arg] || arg) : (typeof v === "function" ? v(arg) : v);
}
function load(text, key, arg){
  try { current = parseSave(text); render(current); showMsg("ok", key || "ok_n", arg ? Object.assign({ n: current.chars.length }, arg) : current.chars.length); return true; }
  catch (e) { showMsg("err", null, e.message === "nokey" ? "e_nokey" : e.message === "nochar" ? "e_nochar" : e.message); return false; }
}
const isNick = s => /^[A-Za-z0-9_\-]{2,30}$/.test(s.trim());
async function loadNick(name){
  name = name.trim();
  if (!isNick(name)) return;
  $("#nick").value = name;
  const btn = $("#nickBtn"); btn.disabled = true;
  showMsg("ok", "nick_loading", name);
  try {
    const r = await fetch(`https://cdn.idleonefficiency.com/profiles/${encodeURIComponent(name.toLowerCase())}.json`, { cache: "no-cache" });
    if (!r.ok) { showMsg("errf", "e_nick", { name, status: r.status }); return; }
    const text = await r.text();
    if (load(text, "ok_nick", { name })) {
      store.set("ss-nick", name); store.set("ss-src", "nick");
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch(e){}
    }
  } catch (e) { showMsg("errf", "e_nickfail", { name, err: e.message }); }
  finally { btn.disabled = false; }
}
$("#nickForm").addEventListener("submit", e => { e.preventDefault(); loadNick($("#nick").value); });
$("#go").addEventListener("click", () => {
  const t = $("#save").value;
  if (isNick(t)) { loadNick(t); return; }
  if (load(t)) { store.set("ss-save", t); store.set("ss-src", "raw"); try { history.replaceState(null, "", location.pathname); } catch(e){} }
});
$("#save").addEventListener("paste", () => setTimeout(() => $("#go").click(), 0));
$("#file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { $("#save").value = t; $("#go").click(); }); });
$("#demo").addEventListener("click", () => { $("#save").value = ""; load(JSON.stringify(SAMPLE), "ok_demo"); });
$("#hideDone").addEventListener("change", () => { if (current) render(current); store.set("ss-hide", $("#hideDone").checked ? "1" : ""); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("ss-lang", lang); applyLang(); }));

const tip = $("#tip");
const BY_ID = Object.fromEntries(STARS.map(s => [s.id, s]));
function starMedia(st){
  if (!st) return "";
  const a = st.area || {};
  let h = "";
  if (a.w) {
    const dots = (DOTS[a.w] || []).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7.5" fill="#ff0" stroke="#000" stroke-width="1"/>`).join("");
    h += `<svg viewBox="0 0 811 433" role="img" aria-label="${esc(st.map)}"><image href="img/maps/${a.w}.png" width="811" height="433"/>${dots}`
      + `<circle cx="${a.hi[0]}" cy="${a.hi[1]}" r="15" fill="#f0f" stroke="#000" stroke-width="2"/></svg>`;
  }
  h += `<div class="loc">${L.location}: <b>${esc(st.map)}</b> · ${lang === "ru" ? st.w : st.w_en}, ${esc(st.region)}</div>`;
  const mobs = (a.mobs || []).map(([n, f]) => `<div class="mob"><img src="img/mobs/${encodeURIComponent(f)}" alt="">${esc(n)}</div>`).join("");
  h += `<div class="media"><img class="shot" src="img/${st.id}.png" width="120" height="120" alt="">${mobs ? `<div class="mobs">${mobs}</div>` : ""}</div>`;
  return h;
}
function showTip(el, x, y){
  const [a, b, c, sid] = el.dataset.tip.split("|");
  tip.innerHTML = `<b>${a}</b>` + (sid ? starMedia(BY_ID[sid]) : "")
    + (b ? `<div>${b}</div>` : "") + (c ? `<div class="t">${c}</div>` : "")
    + (sid ? `<div class="src">${L.imgsrc}</div>` : "");
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - r.width - 8)) + "px";
  const below = y + 16, above = y - r.height - 10;
  tip.style.top = Math.max(8, Math.min(below + r.height <= innerHeight - 8 ? below : above, innerHeight - r.height - 8)) + "px";
}
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener("mousemove", e => { const el = e.target.closest("[data-tip]"); if (el && !tip.hidden) showTip(el, e.clientX, e.clientY); });
document.addEventListener("click", e => { const el = e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 10); } else tip.hidden = true; });
addEventListener("scroll", () => tip.hidden = true, true);

$("#hideDone").checked = !!store.get("ss-hide");
applyLang();
const hashNick = decodeURIComponent(location.hash.slice(1));
const saved = store.get("ss-save"), savedNick = store.get("ss-nick");
if (isNick(hashNick)) { $("#demo").click(); loadNick(hashNick); }
else if (store.get("ss-src") === "nick" && savedNick) { $("#demo").click(); loadNick(savedNick); }
else if (!(saved && load(saved, "ok_saved"))) $("#demo").click();
if (!$("#nick").value && savedNick) $("#nick").value = savedNick;
addEventListener("hashchange", () => { const n = decodeURIComponent(location.hash.slice(1)); if (isNick(n) && n !== $("#nick").value) loadNick(n); });
</script>
</body>
</html>
